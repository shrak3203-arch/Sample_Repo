# .github/workflows/agent-dispatch.yml
# Agent Dispatch for Jira -> Claude Code. Requires repo secret ANTHROPIC_API_KEY
# (use a dedicated, spend-capped key: the agent runs with it in env).
# ALSO REQUIRED once per repo: Settings -> Actions -> General -> Workflow
# permissions -> enable "Allow GitHub Actions to create and approve pull
# requests" (or the gh pr create step fails with "not permitted").
name: agent-dispatch
on:
  repository_dispatch:
    types: [agent-dispatch]
permissions:
  contents: write
  pull-requests: write
concurrency: agent-dispatch-${{ github.event.client_payload.agentDispatch.issueKey }}
jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Check payload contract
        env:
          V: ${{ github.event.client_payload.agentDispatch.contractVersion }}
          CB_URL: ${{ github.event.client_payload.agentDispatch.callbackUrl }}
          CB_TOKEN: ${{ github.event.client_payload.agentDispatch.callbackToken }}
          RUN_ID: ${{ github.event.client_payload.agentDispatch.runId }}
          ISSUE: ${{ github.event.client_payload.agentDispatch.issueKey }}
        run: |
          if [ "$V" != "1" ]; then
            if [ -n "$CB_URL" ]; then
              jq -n --arg t "$CB_TOKEN" --arg r "$RUN_ID" --arg i "$ISSUE" \
                --arg e "Workflow/app contract mismatch — reinstall the workflow from the app's admin page." \
                '{token:$t,runId:$r,issueKey:$i,status:"failed",error:$e}' \
                | curl -sf --retry 3 --max-time 30 -X POST -H 'Content-Type: application/json' -d @- "$CB_URL" || true
            fi
            echo "Unsupported payload contract version: '$V'" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.agentDispatch.baseBranch }}
          fetch-depth: 0
          # No credentials on disk while the agent runs; the push step brings
          # its own, scoped to itself.
          persist-credentials: false
      - name: Pick working branch
        id: branch
        env:
          HINT: ${{ github.event.client_payload.agentDispatch.branchHint }}
          REUSE: ${{ github.event.client_payload.agentDispatch.reuseIssueBranch }}
        run: |
          existing=""
          if [ "$REUSE" = "true" ]; then
            existing=$(git branch -r --list "origin/$HINT-*" | head -1 | sed 's|^[[:space:]]*origin/||')
          fi
          branch="${existing:-$HINT-agent}"
          git checkout "$branch" 2>/dev/null || git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: Run Claude Code
        id: agent
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TITLE: ${{ github.event.client_payload.agentDispatch.title }}
          BODY: ${{ github.event.client_payload.agentDispatch.body }}
          ISSUE: ${{ github.event.client_payload.agentDispatch.issueKey }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "Work item $ISSUE: $TITLE

          $BODY

          Implement this change in the current branch. Run the project's tests if present." \
            --dangerously-skip-permissions --output-format text > /tmp/agent-summary.txt
      - name: Push + open PR
        id: pr
        if: steps.agent.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE: ${{ github.event.client_payload.agentDispatch.issueKey }}
          TITLE: ${{ github.event.client_payload.agentDispatch.title }}
          BASE: ${{ github.event.client_payload.agentDispatch.baseBranch }}
          URL: ${{ github.event.client_payload.agentDispatch.issueUrl }}
        run: |
          # The agent had write access to the working tree INCLUDING .git — a
          # prompt-injected agent could have planted hooks or rewritten config
          # (insteadOf/proxy/credential.helper) to capture the token this step
          # holds. Reset both before any credentialed git command runs.
          rm -f .git/config
          rm -rf .git/hooks && mkdir .git/hooks
          git config core.hooksPath /dev/null
          git config user.name "agent-dispatch"
          git config user.email "agent-dispatch@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git add -A
          git diff --cached --quiet && { echo "no changes produced"; exit 1; }
          git commit --no-verify -m "$ISSUE: $TITLE"
          git push --no-verify -u origin "$BRANCH"
          pr_url=$(gh pr create --base "$BASE" --head "$BRANCH" \
            --title "$ISSUE: $TITLE" --body "Automated by Agent Dispatch for Jira. Work item: $URL")
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
      - name: Report back to Jira
        if: always()
        env:
          CB_URL: ${{ github.event.client_payload.agentDispatch.callbackUrl }}
          CB_TOKEN: ${{ github.event.client_payload.agentDispatch.callbackToken }}
          RUN_ID: ${{ github.event.client_payload.agentDispatch.runId }}
          ISSUE: ${{ github.event.client_payload.agentDispatch.issueKey }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ -n "$PR_URL" ]; then
            summary=$(tail -c 1500 /tmp/agent-summary.txt 2>/dev/null || true)
            jq -n --arg t "$CB_TOKEN" --arg r "$RUN_ID" --arg i "$ISSUE" --arg p "$PR_URL" --arg s "$summary" \
              '{token:$t,runId:$r,issueKey:$i,status:"succeeded",prUrl:$p,summary:$s}' \
              | curl -sf --retry 5 --retry-all-errors --max-time 30 -X POST -H 'Content-Type: application/json' -d @- "$CB_URL"
          else
            detail=$(tail -c 300 /tmp/agent-summary.txt 2>/dev/null || true)
            jq -n --arg t "$CB_TOKEN" --arg r "$RUN_ID" --arg i "$ISSUE" \
              --arg e "Agent or PR step failed — see the Actions run log. ${detail:+Agent output: $detail}" \
              '{token:$t,runId:$r,issueKey:$i,status:"failed",error:$e}' \
              | curl -sf --retry 5 --retry-all-errors --max-time 30 -X POST -H 'Content-Type: application/json' -d @- "$CB_URL"
          fi
